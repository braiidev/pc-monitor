[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pc-monitor"
version = "0.1.0"
description = "Monitor de sistema en consola: RAM, SWAP, VRAM, CPU, disco, red y top procesos."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
monitor = "monitor.main:main"

[tool.setuptools.packages.find]
where = ["src"]