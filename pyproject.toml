[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pc-monitor"
version = "0.1.0"
description = "Monitor de sistema en consola: RAM, SWAP, VRAM, CPU, disco, red y top procesos."
requires-python = ">=3.10,<3.15"
dependencies = []

[project.scripts]
monitor = "monitor.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
# strict desde v0.9.20: los 59 errores previos eran casi todos firmas `args: object`
# en vez de argparse.Namespace, más variables reusadas con dos tipos distintos.
# Verificar: .venv/bin/python -m mypy --strict src/monitor/
strict = true
files = ["src/monitor"]

[tool.black]
line-length = 88
target-version = ["py310"]
